# Deploy the site to GitHub Pages from dev: run the gate, then publish the repository root. Pages source must be "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Several agents push to dev. A deploy that has started is never cut off: it finishes, then the newest waiting
# push deploys. GitHub keeps one waiting run per group, so a push that is overtaken while it waits shows as
# cancelled; the run after it ships its commit too. /status/ on the PHP site shows these as superseded.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  gate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the gate
        run: python3 admin/build/validate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
